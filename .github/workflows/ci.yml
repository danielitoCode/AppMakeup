name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 🔑 OBLIGATORIO Y ANTES DE TODO
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble
        run: ./gradlew assemble --no-daemon